name: Deploy Asterion EDA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify standalone application
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-*.b64 | base64 --decode > AsterionEDA.html.xz
          xz --decompress --stdout AsterionEDA.html.xz > index.html
          sha256sum --check payload/SHA256
          test "$(wc -c < index.html)" -eq 251624
          mkdir -p _site
          cp index.html _site/index.html

      - name: Persist verified standalone source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore exact Asterion EDA standalone app"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
