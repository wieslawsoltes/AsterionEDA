<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b34"><title>Asterion EDA</title>
<style>
:root{font:12px Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#dce7eb;background:#17242b;--bg:#17242b;--panel:#213139;--panel2:#2a3b44;--line:#3b4b53;--accent:#46b5b7;--gold:#d5a93d;--red:#db5c63;--blue:#5d8fd8;--green:#62b578}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}button,input,select{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}.app{height:100%;display:grid;grid-template-rows:35px 34px 1fr 24px;background:var(--bg)}.title{display:flex;align-items:center;padding:0 10px;background:#121d22;border-bottom:1px solid #34444b;gap:12px}.brand{font-weight:800;letter-spacing:1.5px;color:#fff}.brand b{color:var(--accent)}.menu button,.toolbar button,.tabs button{padding:7px 9px;border-radius:3px}.menu button:hover,.toolbar button:hover,.tabs button:hover{background:#31444e}.spacer{flex:1}.badge{font-size:10px;padding:3px 7px;border:1px solid #49606b;border-radius:9px;color:#9fc8cc}.toolbar{display:flex;align-items:center;gap:2px;padding:0 7px;background:#1d2b32;border-bottom:1px solid #34444b}.toolbar .sep{width:1px;height:20px;background:#40515a;margin:0 4px}.toolbar button.active{background:#3a5963;color:#fff}.work{min-height:0;display:grid;grid-template-columns:220px 1fr 270px}.panel{min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.panel.right{border-right:0;border-left:1px solid var(--line)}.ph{height:32px;display:flex;align-items:center;padding:0 9px;font-weight:700;background:#263941;border-bottom:1px solid var(--line)}.tree{padding:8px;overflow:auto}.node{padding:5px 6px;border-radius:3px;white-space:nowrap}.node:hover,.node.sel{background:#314a54}.indent{padding-left:20px}.small{font-size:10px;color:#8ea1aa}.center{min-width:0;display:grid;grid-template-rows:31px 1fr 110px;background:#111a1f}.tabs{display:flex;background:#1b2a31;border-bottom:1px solid var(--line);overflow:auto}.tabs button{border-radius:0;border-right:1px solid #33444d;white-space:nowrap}.tabs button.active{background:#263a43;border-bottom:2px solid var(--accent)}.viewport{position:relative;min-height:0;overflow:hidden;background:#101a20}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:10px;top:10px;background:#0c1419cc;border:1px solid #38505b;border-radius:4px;padding:6px 8px;pointer-events:none}.messages{border-top:1px solid var(--line);overflow:auto;background:#17252c}.messages .row{display:grid;grid-template-columns:64px 1fr 70px;padding:4px 8px;border-bottom:1px solid #263740}.error{color:#ff8d91}.warn{color:#f2c766}.ok{color:#79d28a}.props{padding:8px;overflow:auto}.section{margin-bottom:12px}.section h4{margin:0 0 6px;color:#9db0b9;font-size:10px;text-transform:uppercase;letter-spacing:.8px}.field{display:grid;grid-template-columns:90px 1fr;gap:5px;align-items:center;margin:4px 0}.field input,.field select{width:100%;background:#18272e;border:1px solid #40515a;padding:4px;border-radius:2px}.layers .layer{display:flex;gap:7px;align-items:center;padding:5px 2px}.sw{width:10px;height:10px;border-radius:2px}.status{display:flex;align-items:center;gap:14px;padding:0 8px;background:#112027;border-top:1px solid #304149;color:#9aadb5}.status b{color:#d8e6e9}.pill{margin-left:auto}.fab{position:absolute;right:10px;bottom:10px;background:#2d8b8d;padding:8px 11px;border-radius:4px;color:#fff;box-shadow:0 3px 12px #0006}.lib button{display:flex;width:100%;justify-content:space-between;padding:6px;border-radius:3px}.lib button:hover{background:#314a54}.bom{position:absolute;inset:0;overflow:auto;padding:16px}.bom table{width:100%;border-collapse:collapse}.bom th,.bom td{text-align:left;padding:7px;border-bottom:1px solid #34454d}.bom th{position:sticky;top:0;background:#1d2b32}.mobile{display:none}@media(max-width:900px){.work{grid-template-columns:1fr}.panel{display:none}.panel.right{display:none}.mobile{display:block}.toolbar{overflow:auto}.messages{height:90px}}
</style>
</head>
<body><div id="app" class="app">
<div class="title"><div class="brand"><b>ASTERION</b> EDA</div><div class="menu"><button>File</button><button>Edit</button><button>View</button><button>Place</button><button>Route</button><button>Tools</button></div><div class="spacer"></div><span class="badge" id="backend">Canvas</span><span class="small">Aurora Sensor Hub</span></div>
<div class="toolbar"><button data-tool="select" class="active">↖ Select</button><button data-tool="place">＋ Component</button><button data-tool="wire">⌁ Wire</button><button data-tool="route">⌇ Route</button><button data-tool="via">⊙ Via</button><span class="sep"></span><button id="undo">↶</button><button id="redo">↷</button><button id="zoomfit">Fit</button><button id="drc">DRC</button><span class="spacer"></span><button id="save">Save</button><button id="export">Export JSON</button></div>
<div class="work">
<div class="panel"><div class="ph">Projects</div><div class="tree"><div class="node sel">▾ Aurora Sensor Hub</div><div class="node indent" data-view="schematic">▣ Power.SchDoc</div><div class="node indent" data-view="schematic">▣ MCU.SchDoc</div><div class="node indent" data-view="pcb">▤ Aurora.PcbDoc</div><div class="node indent" data-view="assembly">◈ Assembly 3D</div><div class="node indent" data-view="bom">≡ Bill of Materials</div></div><div class="ph">Components</div><div class="tree lib" id="lib"></div></div>
<div class="center"><div class="tabs"><button data-view="schematic">Power.SchDoc</button><button class="active" data-view="pcb">Aurora.PcbDoc</button><button data-view="assembly">3D Layout</button><button data-view="bom">BOM</button></div><div class="viewport"><canvas id="gpu"></canvas><canvas id="overlay"></canvas><div id="bom" class="bom" hidden></div><div class="hud" id="hud">PCB · Top Layer<br><span class="small">Grid 0.25 mm · Snap on</span></div><button class="fab" id="run">Run Design Rule Check</button></div><div class="messages" id="messages"></div></div>
<div class="panel right"><div class="ph">Properties</div><div class="props" id="props"></div><div class="ph">Layers</div><div class="props layers" id="layers"></div></div>
</div><div class="status"><span>Ready</span><span>X <b id="sx">0.00</b> mm</span><span>Y <b id="sy">0.00</b> mm</span><span>Zoom <b id="sz">100%</b></span><span class="pill">Local-first · <b id="rev">r1</b></span></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const LIB=[['R','Resistor 0603',2],['C','Capacitor 0603',2],['U','QFN-32 MCU',32],['U','LDO SOT-23-5',5],['J','USB-C Connector',16],['J','Header 1x6',6],['D','LED 0603',2],['Q','MOSFET SOT-23',3],['L','Inductor 0805',2],['TP','Test Point',1]];
const fresh=()=>({name:'Aurora Sensor Hub',revision:1,board:{w:92,h:62},components:[{id:uid(),ref:'U1',value:'MCU',x:46,y:31,w:10,h:10,pins:32},{id:uid(),ref:'J1',value:'USB-C',x:10,y:30,w:12,h:8,pins:16},{id:uid(),ref:'U2',value:'3V3 LDO',x:27,y:19,w:7,h:5,pins:5},{id:uid(),ref:'C1',value:'10uF',x:34,y:20,w:4,h:2,pins:2},{id:uid(),ref:'R1',value:'10k',x:57,y:22,w:4,h:2,pins:2},{id:uid(),ref:'D1',value:'STATUS',x:70,y:20,w:4,h:2,pins:2},{id:uid(),ref:'J2',value:'I/O',x:82,y:31,w:7,h:16,pins:6}],tracks:[{id:uid(),net:'GND',layer:'Bottom',w:.35,pts:[[10,32],[20,32],[20,48],[75,48]]},{id:uid(),net:'3V3',layer:'Top',w:.3,pts:[[30,20],[38,20],[38,27],[43,27]]},{id:uid(),net:'VBUS',layer:'Top',w:.5,pts:[[16,30],[23,30],[23,20],[24,20]]},{id:uid(),net:'SDA',layer:'Top',w:.25,pts:[[51,29],[65,29],[65,35],[78,35]]},{id:uid(),net:'SCL',layer:'Top',w:.25,pts:[[51,32],[62,32],[62,39],[78,39]]}],vias:[{id:uid(),x:20,y:48,net:'GND'},{id:uid(),x:65,y:35,net:'SDA'}],nets:['GND','3V3','VBUS','SDA','SCL','LED','RESET']});
let state=JSON.parse(localStorage.getItem('asterion.project')||'null')||fresh(),history=[],future=[],view='pcb',tool='select',selected=null,route=null,cam={x:0,y:0,z:1},drag=null;
const gpu=$('#gpu'),cv=$('#overlay'),ctx=cv.getContext('2d');
function snapshot(){history.push(JSON.stringify(state));if(history.length>50)history.shift();future=[]}function changed(){state.revision++;$('#rev').textContent='r'+state.revision;localStorage.setItem('asterion.project',JSON.stringify(state));renderAll()}
function resize(){for(const c of [gpu,cv]){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}fit();render()}addEventListener('resize',resize);
function fit(){let w=cv.clientWidth,h=cv.clientHeight;if(view==='pcb'){cam.z=Math.min((w-80)/state.board.w,(h-60)/state.board.h);cam.x=(w-state.board.w*cam.z)/2;cam.y=(h-state.board.h*cam.z)/2}else{cam.z=1;cam.x=0;cam.y=0}$('#sz').textContent=Math.round(cam.z*100)+'%'}
const s2w=(x,y)=>[(x-cam.x)/cam.z,(y-cam.y)/cam.z],w2s=(x,y)=>[cam.x+x*cam.z,cam.y+y*cam.z];
function grid(){let [ox,oy]=w2s(0,0),step=5*cam.z;ctx.strokeStyle='#1e333d';ctx.lineWidth=1;for(let x=ox%step;x<cv.clientWidth;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.clientHeight);ctx.stroke()}for(let y=oy%step;y<cv.clientHeight;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.clientWidth,y);ctx.stroke()}}
function pad(x,y,r=1.2,col='#d2a63a'){let [sx,sy]=w2s(x,y);ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx,sy,r*cam.z,0,7);ctx.fill();ctx.strokeStyle='#f4d77a';ctx.stroke()}
function comp(c){let [x,y]=w2s(c.x-c.w/2,c.y-c.h/2);ctx.fillStyle=selected===c.id?'#335e66':'#27414a';ctx.strokeStyle=selected===c.id?'#7de1df':'#78a6ae';ctx.lineWidth=1.2;ctx.fillRect(x,y,c.w*cam.z,c.h*cam.z);ctx.strokeRect(x,y,c.w*cam.z,c.h*cam.z);ctx.fillStyle='#dce8ea';ctx.font='11px system-ui';ctx.fillText(c.ref,x+3,y-4);let n=Math.min(c.pins,8);for(let i=0;i<n;i++){let t=(i+1)/(n+1);pad(c.x-c.w/2,c.y-c.h/2+t*c.h,.45);pad(c.x+c.w/2,c.y-c.h/2+t*c.h,.45)}}
function track(t){ctx.strokeStyle=t.layer==='Top'?'#d75f5f':'#5d83d7';ctx.lineWidth=Math.max(2,t.w*cam.z);ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();t.pts.forEach((p,i)=>{let q=w2s(...p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke()}
function renderPCB(){grid();let [bx,by]=w2s(0,0);ctx.fillStyle='#164e38aa';ctx.fillRect(bx,by,state.board.w*cam.z,state.board.h*cam.z);ctx.strokeStyle='#c7d7cb';ctx.strokeRect(bx,by,state.board.w*cam.z,state.board.h*cam.z);state.tracks.forEach(track);state.vias.forEach(v=>pad(v.x,v.y,1,'#b89442'));state.components.forEach(comp);if(route){ctx.strokeStyle='#80f1e8';ctx.lineWidth=2;ctx.setLineDash([6,3]);ctx.beginPath();let a=w2s(...route.start),b=w2s(...route.end);ctx.moveTo(...a);ctx.lineTo(b[0],a[1]);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([])}}
function renderSch(){ctx.fillStyle='#f7f3e6';ctx.fillRect(0,0,cv.clientWidth,cv.clientHeight);ctx.strokeStyle='#ddd4bd';for(let x=20;x<cv.clientWidth;x+=20)for(let y=20;y<cv.clientHeight;y+=20){ctx.fillRect(x,y,1,1)}ctx.save();ctx.translate(80,55);state.components.forEach((c,i)=>{let x=(i%4)*180,y=Math.floor(i/4)*150;ctx.strokeStyle='#2d7c85';ctx.fillStyle='#fff';ctx.fillRect(x,y,95,60);ctx.strokeRect(x,y,95,60);ctx.fillStyle='#25383d';ctx.font='12px system-ui';ctx.fillText(c.ref+'  '+c.value,x+5,y+25);ctx.strokeStyle='#3c6b6f';for(let p=0;p<4;p++){ctx.beginPath();ctx.moveTo(x-20,y+12+p*12);ctx.lineTo(x,y+12+p*12);ctx.stroke()}if(i>0){ctx.strokeStyle='#398e74';ctx.beginPath();ctx.moveTo(x-85,y+30);ctx.lineTo(x-20,y+30);ctx.stroke()}});ctx.restore()}
function render3D(){let w=cv.clientWidth,h=cv.clientHeight,g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#263b46');g.addColorStop(1,'#0c1216');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2,h/2+40);ctx.transform(1,-.25,.8,.35,0,0);ctx.fillStyle='#175a3f';ctx.fillRect(-220,-140,440,280);ctx.strokeStyle='#91bea1';ctx.strokeRect(-220,-140,440,280);state.components.forEach(c=>{let x=(c.x/state.board.w-.5)*420,y=(c.y/state.board.h-.5)*260;ctx.fillStyle='#202a2f';ctx.fillRect(x-c.w*2,y-c.h*2,c.w*4,c.h*4);ctx.strokeStyle='#728991';ctx.strokeRect(x-c.w*2,y-c.h*2,c.w*4,c.h*4)});ctx.restore();ctx.fillStyle='#dce7eb';ctx.font='15px system-ui';ctx.fillText('Procedural 3D assembly preview',18,28)}
function render(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);$('#bom').hidden=view!=='bom';cv.hidden=view==='bom';if(view==='pcb')renderPCB();else if(view==='schematic')renderSch();else if(view==='assembly')render3D();if(view==='bom')renderBOM()}
function renderBOM(){let map={};state.components.forEach(c=>{let k=c.value;(map[k]??={value:k,refs:[],qty:0}).refs.push(c.ref);map[k].qty++});$('#bom').innerHTML='<h2>Bill of Materials</h2><table><thead><tr><th>Qty</th><th>References</th><th>Value / Part</th></tr></thead><tbody>'+Object.values(map).map(x=>`<tr><td>${x.qty}</td><td>${x.refs.join(', ')}</td><td>${x.value}</td></tr>`).join('')+'</tbody></table>'}
function props(){let c=state.components.find(x=>x.id===selected);$('#props').innerHTML=c?`<div class=section><h4>Component</h4><div class=field><label>Designator</label><input id=pref value="${c.ref}"></div><div class=field><label>Value</label><input id=pval value="${c.value}"></div><div class=field><label>X</label><input id=px type=number step=.25 value="${c.x}"></div><div class=field><label>Y</label><input id=py type=number step=.25 value="${c.y}"></div></div><div class=small>ID ${c.id}</div>`:'<div class=small>Select an object to edit its properties.</div>';['pref','pval','px','py'].forEach(id=>{let e=$('#'+id);if(e)e.onchange=()=>{snapshot();if(id==='pref')c.ref=e.value;if(id==='pval')c.value=e.value;if(id==='px')c.x=+e.value;if(id==='py')c.y=+e.value;changed()}})}
function layers(){$('#layers').innerHTML=[['#db6565','Top Copper'],['#5d83d7','Bottom Copper'],['#d5a93d','Pads / Vias'],['#e4e7df','Top Overlay'],['#6db783','Board Outline']].map(x=>`<div class=layer><span class=sw style="background:${x[0]}"></span><input type=checkbox checked> ${x[1]}</div>`).join('')}
function renderAll(){props();layers();render();$('#rev').textContent='r'+state.revision}
function hit(x,y){let [wx,wy]=s2w(x,y);return [...state.components].reverse().find(c=>Math.abs(wx-c.x)<=c.w/2+1&&Math.abs(wy-c.y)<=c.h/2+1)}
cv.onpointerdown=e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,[wx,wy]=s2w(x,y);if(view!=='pcb')return;if(tool==='route'){if(!route)route={start:[wx,wy],end:[wx,wy]};else{snapshot();let pts=[route.start,[route.end[0],route.start[1]],route.end];state.tracks.push({id:uid(),net:'NET'+(state.tracks.length+1),layer:'Top',w:.25,pts});route=null;changed()}return}if(tool==='via'){snapshot();state.vias.push({id:uid(),x:Math.round(wx*4)/4,y:Math.round(wy*4)/4,net:'GND'});changed();return}if(tool==='place'){snapshot();let n=state.components.length+1;state.components.push({id:uid(),ref:'U'+n,value:'New Component',x:wx,y:wy,w:7,h:5,pins:8});changed();return}let c=hit(x,y);selected=c?.id||null;props();if(c){snapshot();drag={id:c.id,dx:wx-c.x,dy:wy-c.y};cv.setPointerCapture(e.pointerId)}render()};
cv.onpointermove=e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,[wx,wy]=s2w(x,y);$('#sx').textContent=wx.toFixed(2);$('#sy').textContent=wy.toFixed(2);if(route){route.end=[Math.round(wx*4)/4,Math.round(wy*4)/4];render()}if(drag){let c=state.components.find(c=>c.id===drag.id);c.x=cl(Math.round((wx-drag.dx)*4)/4,0,state.board.w);c.y=cl(Math.round((wy-drag.dy)*4)/4,0,state.board.h);render()}};cv.onpointerup=()=>{if(drag){drag=null;changed()}};
cv.onwheel=e=>{if(view!=='pcb')return;e.preventDefault();let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,[wx,wy]=s2w(x,y),nz=cl(cam.z*Math.exp(-e.deltaY*.001),2,30);cam.x=x-wx*nz;cam.y=y-wy*nz;cam.z=nz;$('#sz').textContent=Math.round(nz*100)+'%';render()};
function drc(){let m=[],b=state.board;for(let c of state.components){if(c.x-c.w/2<1||c.y-c.h/2<1||c.x+c.w/2>b.w-1||c.y+c.h/2>b.h-1)m.push(['ERROR',c.ref+' violates board-edge clearance'])}for(let i=0;i<state.components.length;i++)for(let j=i+1;j<state.components.length;j++){let a=state.components[i],c=state.components[j];if(Math.abs(a.x-c.x)<(a.w+c.w)/2&&Math.abs(a.y-c.y)<(a.h+c.h)/2)m.push(['ERROR',a.ref+' overlaps '+c.ref])}if(state.tracks.length<state.components.length-1)m.push(['WARN','Unrouted connectivity remains']);if(!m.length)m.push(['OK','No violations detected by implemented rules']);$('#messages').innerHTML=m.map(x=>`<div class=row><b class="${x[0]==='ERROR'?'error':x[0]==='WARN'?'warn':'ok'}">${x[0]}</b><span>${x[1]}</span><span>PCB</span></div>`).join('');return m}
function setView(v){view=v;$$('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#hud').innerHTML=({pcb:'PCB · Top Layer',schematic:'Schematic · Power',assembly:'3D Assembly',bom:'Bill of Materials'})[v]+'<br><span class=small>Asterion EDA workspace</span>';$('#run').hidden=v==='bom';fit();render()}
$$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$$('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));route=null;render()});
$('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());selected=null;renderAll()};$('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());selected=null;renderAll()};$('#zoomfit').onclick=()=>{fit();render()};$('#drc').onclick=$('#run').onclick=drc;$('#save').onclick=()=>{localStorage.setItem('asterion.project',JSON.stringify(state));$('#messages').innerHTML='<div class=row><b class=ok>SAVED</b><span>Project persisted to browser storage.</span><span>LOCAL</span></div>'};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='Aurora-Sensor-Hub.asterion';a.click();URL.revokeObjectURL(a.href)};
$('#lib').innerHTML=LIB.map((p,i)=>`<button data-p="${i}"><span>${p[0]} · ${p[1]}</span><span class=small>${p[2]} pins</span></button>`).join('');$('#lib').onclick=e=>{let b=e.target.closest('button');if(!b)return;tool='place';$$('[data-tool]').forEach(x=>x.classList.toggle('active',x.dataset.tool==='place'))};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('#redo').click():$('#undo').click()}else if(e.key==='1')setView('schematic');else if(e.key==='2')setView('pcb');else if(e.key==='3')setView('assembly');else if(e.key==='4')setView('bom');else if(e.key.toLowerCase()==='x')$('[data-tool=route]').click();else if(e.key.toLowerCase()==='p')$('[data-tool=place]').click();else if(e.key.toLowerCase()==='v')$('[data-tool=via]').click();else if(e.key==='F7')drc();else if(e.key==='Escape'){route=null;tool='select';$('[data-tool=select]').click()}});
async function initGPU(){if(!navigator.gpu)return;try{let a=await navigator.gpu.requestAdapter();if(!a)return;await a.requestDevice();$('#backend').textContent='WebGPU ready';$('#backend').style.borderColor='#46b5b7'}catch{}}initGPU();layers();props();resize();drc();
})();
</script></body></html>
